plugins { id 'com.android.library'; id 'com.chaquo.python' }
android {
    namespace 'org.datamatrix.linereader'
    compileSdk 36
    defaultConfig { minSdk 30; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
    sourceSets {
        main {
            java.srcDirs += ['../vendor/pcb-line-code-reader/src']
            java.exclude '**/MainActivity.java'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
chaquopy {
    defaultConfig {
        version '3.10'
        buildPython(System.getenv('PYTHON310') ?: 'python3.10')
        pip { install 'numpy==1.26.2'; install 'opencv-python==4.5.1.48' }
    }
    sourceSets { main { srcDirs = ['../vendor/pcb-line-code-reader/python'] } }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }
