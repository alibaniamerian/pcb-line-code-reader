plugins { id 'com.android.application' }
def operatorSandbox = project.hasProperty('operatorSandbox')
android {
    namespace 'com.ozak.inventory'
    compileSdk 36
    buildToolsVersion '36.0.0'
    signingConfigs { debug { storeFile rootProject.file('.android/pilot-debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    defaultConfig {
        applicationId 'com.ozak.inventory'
        minSdk 30
        targetSdk 36
        versionCode 10
        versionName '0.7.0-reel-check-ready-pilot'
        testInstrumentationRunner 'com.ozak.inventory.OperatorInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (operatorSandbox) {
        defaultConfig { applicationId 'com.ozak.inventory.sandbox.operator'; versionName '0.3.0-operator-sandbox' }
        sourceSets.main {
            java.setSrcDirs(['build/operatorSandbox/java'])
            manifest.srcFile 'build/operatorSandbox/AndroidManifest.xml'
            res.srcDirs += ['src/sandbox/res']
        }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation project(':scanner') }
